aid: joesfuturefood
name: Joes Future Food (Zhouzi Future)
description: Joes Future Food (周子未来 / Nanjing Zhouzi Future Food Technology Co., Ltd.)
  is a Nanjing-based cellular agriculture and food-technology company pioneering cultivated
  (cell-cultured) meat in China. The founding team produced what it describes as China's
  first piece of cultivated meat, and the company develops cell-cultured pork products
  (pork belly, fatback, skin, meatballs, and a mixed family pack) alongside serum-free
  culture media and a catalog of primary and gene-edited animal cell lines (porcine
  adipose and muscle stem cells, bovine muscle and adipose cells, chicken embryo fibroblasts,
  and more) used across cultivated-meat research and biomanufacturing. Backed by Qiming
  Venture Partners. The company runs a corporate marketing website and publishes no
  public API, developer portal, or machine-readable specification.
